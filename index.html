<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>黑貓拍拍：爆汁蟑螂 ASMR 紓壓大作戰</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background-color: #0d0d12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a24 0%, #08080c 100%);
            overflow: hidden;
            cursor: none;
        }

        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 60px 60px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            pointer-events: none;
        }

        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .hud-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .hud-card {
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 8px 18px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .hud-label {
            font-size: 0.75rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #aeea00;
        }

        .btn-home {
            pointer-events: auto;
            background: #ff3d00;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 61, 0, 0.4);
            transition: transform 0.1s;
        }

        .btn-home:active {
            transform: scale(0.95);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 8, 12, 0.88);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2.6rem;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #aeea00, #ff9100);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(174, 234, 0, 0.3);
        }

        p.subtitle {
            color: #bbb;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .size-selector-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .size-label {
            font-size: 0.95rem;
            color: #ffca28;
            font-weight: bold;
        }

        .size-options {
            display: flex;
            gap: 10px;
        }

        .btn-size {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-size.active {
            background: #aeea00;
            color: #121212;
            font-weight: bold;
            border-color: #aeea00;
            box-shadow: 0 0 12px rgba(174, 234, 0, 0.5);
        }

        .mode-cards {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
        }

        .mode-card {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 22px;
            width: 250px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mode-card:hover, .mode-card:active {
            transform: translateY(-5px);
            border-color: #aeea00;
            background: rgba(174, 234, 0, 0.1);
            box-shadow: 0 10px 30px rgba(174, 234, 0, 0.25);
        }

        .mode-icon {
            font-size: 3.2rem;
            margin-bottom: 10px;
        }

        .mode-title {
            font-size: 1.35rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }

        .mode-desc {
            font-size: 0.85rem;
            color: #aaa;
            line-height: 1.4;
        }

        .btn-action {
            background: linear-gradient(45deg, #aeea00, #76ff03);
            color: #121212;
            border: none;
            padding: 14px 36px;
            font-size: 1.25rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 20px rgba(118, 255, 3, 0.4);
            transition: transform 0.1s;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        #joystick-wrapper {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            z-index: 50;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #joystick-stick {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #aeea00, #64dd17);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            position: absolute;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="grid-bg"></div>

        <div id="hud" class="hidden">
            <button class="btn-home" id="btn-hud-home">🏠 首頁</button>
            <div class="hud-group" id="hud-stats">
                <div class="hud-card">
                    <span class="hud-label">連擊 COMBO</span>
                    <span class="hud-value" id="val-combo" style="color:#ffea00;">0</span>
                </div>
                <div class="hud-card">
                    <span class="hud-label">得分</span>
                    <span class="hud-value" id="val-score">0</span>
                </div>
                <div class="hud-card" id="card-time">
                    <span class="hud-label">剩餘時間</span>
                    <span class="hud-value" id="val-time" style="color:#ff3d00;">30</span>
                </div>
            </div>
        </div>

        <div id="joystick-wrapper" class="hidden">
            <div id="joystick-stick"></div>
        </div>

        <div id="menu-overlay" class="overlay">
            <h1>黑貓拍拍：爆汁 ASMR</h1>
            <p class="subtitle">聽覺與視覺的雙重紓壓打擊樂趣！</p>

            <div class="size-selector-box">
                <span class="size-label">🪳 玩家模式蟑螂體型：</span>
                <div class="size-options">
                    <button class="btn-size" data-size="S">迷你 (S)</button>
                    <button class="btn-size active" data-size="M">標準 (M)</button>
                    <button class="btn-size" data-size="XL">巨無霸 (XL)</button>
                </div>
            </div>

            <div class="mode-cards">
                <div class="mode-card" id="mode-cat">
                    <div class="mode-icon">🐾</div>
                    <div class="mode-title">貓爪爆汁拍拍</div>
                    <div class="mode-desc">人用的極致練準度模式！拍爆蟑螂享受 ASMR 爆汁爽感。</div>
                </div>

                <div class="mode-card" id="mode-for-cat" style="border-color: #ff4081; background: rgba(255, 64, 129, 0.08);">
                    <div class="mode-icon">🐈‍⬛</div>
                    <div class="mode-title">主子真貓專用 (特大)</div>
                    <div class="mode-desc">專為家貓設計！超巨大蟑螂、全螢幕感應、無時間限制！</div>
                </div>

                <div class="mode-card" id="mode-roach">
                    <div class="mode-icon">🪳</div>
                    <div class="mode-title">蟑螂極限逃亡</div>
                    <div class="mode-desc">操控蟑螂吃餅乾，閃避天降貓爪重擊！被拍到會瞬間爆漿！</div>
                </div>
            </div>
        </div>

        <div id="gameover-overlay" class="overlay hidden">
            <h1 id="go-title">遊戲結束</h1>
            <p id="go-desc" style="font-size: 1.2rem; color: #aeea00; margin-bottom: 15px;"></p>
            <div class="hud-card" style="margin-bottom: 20px; padding: 15px 30px;">
                <span class="hud-label">最終紓壓分數</span>
                <span class="hud-value" id="go-score" style="font-size: 2.5rem;">0</span>
            </div>
            <div style="display: flex; gap: 15px;">
                <button class="btn-action" id="btn-restart">再爽一次</button>
                <button class="btn-action" id="btn-go-home" style="background: #444; color: #fff; box-shadow:none;">返回首頁</button>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playASMRSound(type, combo = 1, sizeScale = 1.0) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'splatter') {
                const oscThud = audioCtx.createOscillator();
                const gainThud = audioCtx.createGain();
                oscThud.type = 'triangle';
                const baseThud = 160 / sizeScale;
                oscThud.frequency.setValueAtTime(baseThud, now);
                oscThud.frequency.exponentialRampToValueAtTime(30, now + 0.12 * sizeScale);
                gainThud.gain.setValueAtTime(0.6 * sizeScale, now);
                gainThud.gain.linearRampToValueAtTime(0.01, now + 0.12 * sizeScale);
                oscThud.connect(gainThud);
                gainThud.connect(audioCtx.destination);
                oscThud.start(now);
                oscThud.stop(now + 0.12 * sizeScale);

                const bufferSize = audioCtx.sampleRate * 0.15 * sizeScale;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime((1200 + Math.random() * 800) / sizeScale, now);
                filter.Q.setValueAtTime(3, now);

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.5, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15 * sizeScale);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noise.start(now);

                const oscPop = audioCtx.createOscillator();
                const gainPop = audioCtx.createGain();
                oscPop.type = 'sine';
                const baseFreq = 400 + Math.min(combo * 40, 600);
                oscPop.frequency.setValueAtTime(baseFreq, now);
                oscPop.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, now + 0.08);
                gainPop.gain.setValueAtTime(0.2, now);
                gainPop.gain.linearRampToValueAtTime(0.01, now + 0.08);
                oscPop.connect(gainPop);
                gainPop.connect(audioCtx.destination);
                oscPop.start(now);
                oscPop.stop(now + 0.08);

            } else if (type === 'catToyHit') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200 + Math.random() * 800, now);
                osc.frequency.exponentialRampToValueAtTime(2400, now + 0.12);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.12);

            } else if (type === 'eat') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, now);
                osc.frequency.exponentialRampToValueAtTime(1040, now + 0.09);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.09);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.09);

            } else if (type === 'warn') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(360, now + 0.2);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let selectedRoachSize = 'M';
        const sizeConfig = {
            'S':  { scale: 0.6, speedMult: 1.5, hitRadius: 40, scoreMult: 1.5, stainMult: 0.6, particles: 15 },
            'M':  { scale: 1.0, speedMult: 1.0, hitRadius: 60, scoreMult: 1.0, stainMult: 1.0, particles: 25 },
            'XL': { scale: 1.8, speedMult: 0.7, hitRadius: 90, scoreMult: 0.8, stainMult: 2.0, particles: 45 },
            'FOR_CAT': { scale: 3.5, speedMult: 0.9, hitRadius: 140, scoreMult: 1.0, stainMult: 3.0, particles: 50 } // 真貓特大版
        };

        let gameMode = null; // 'CAT', 'FOR_CAT', 'ROACH'
        let isPlaying = false;
        let score = 0;
        let combo = 0;
        let comboTimer = null;
        let timeLeft = 30;
        let timerInterval = null;
        let shakeTime = 0;

        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;

        function getSafeBounds() {
            return {
                minX: 80,
                maxX: canvas.width - 80,
                minY: canvas.height * 0.15,
                maxY: canvas.height * 0.85
            };
        }

        class JuiceStain {
            constructor(x, y, scale = 1.0) {
                this.x = x;
                this.y = y;
                this.size = getRandom(20, 45) * scale;
                this.alpha = 0.8;
                this.color = Math.random() < 0.7 ? '#aeea00' : '#76ff03';
                this.splats = [];
                for (let i = 0; i < Math.floor(6 * scale); i++) {
                    this.splats.push({
                        dx: (Math.random() - 0.5) * this.size * 1.5,
                        dy: (Math.random() - 0.5) * this.size * 1.5,
                        r: getRandom(3, 10) * scale
                    });
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
                ctx.fill();

                this.splats.forEach(s => {
                    ctx.beginPath();
                    ctx.arc(this.x + s.dx, this.y + s.dy, s.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.restore();
            }
        }

        class JuiceParticle {
            constructor(x, y, scale = 1.0) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = getRandom(4, 16) * Math.sqrt(scale);
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.radius = getRandom(3, 8) * scale;
                this.color = Math.random() < 0.6 ? '#aeea00' : (Math.random() < 0.5 ? '#76ff03' : '#ffd600');
                this.alpha = 1.0;
                this.decay = getRandom(0.02, 0.04);
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.92;
                this.vy *= 0.92;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class PopText {
            constructor(x, y, text) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.alpha = 1.0;
                this.vy = -2;
            }
            update() {
                this.y += this.vy;
                this.alpha -= 0.03;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = '900 24px sans-serif';
                ctx.fillStyle = '#aeea00';
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 5;
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        class Roach {
            constructor(type = 'NORMAL') {
                const bounds = getSafeBounds();
                this.x = getRandom(bounds.minX, bounds.maxX);
                this.y = getRandom(bounds.minY, bounds.maxY);
                this.type = type;

                const cfg = gameMode === 'FOR_CAT' ? sizeConfig['FOR_CAT'] : sizeConfig[selectedRoachSize];
                this.scale = cfg.scale;
                this.speedMult = (type === 'FAST' ? 1.8 : 1.0) * cfg.speedMult;

                this.vx = (Math.random() - 0.5) * 6 * this.speedMult;
                this.vy = (Math.random() - 0.5) * 6 * this.speedMult;
                this.angle = Math.atan2(this.vy, this.vx);
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                const bounds = getSafeBounds();

                if (this.x < bounds.minX || this.x > bounds.maxX) this.vx *= -1;
                if (this.y < bounds.minY || this.y > bounds.maxY) this.vy *= -1;

                // 真貓模式專屬的突發飆速與停頓（極度吸引貓咪眼球）
                const changeRate = gameMode === 'FOR_CAT' ? 0.07 : 0.04;
                if (Math.random() < changeRate) {
                    const burst = (gameMode === 'FOR_CAT' && Math.random() < 0.4) ? 2.5 : 1.0;
                    this.vx = (Math.random() - 0.5) * 7 * this.speedMult * burst;
                    this.vy = (Math.random() - 0.5) * 7 * this.speedMult * burst;
                }

                this.angle = Math.atan2(this.vy, this.vx);
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.scale(this.scale, this.scale);

                ctx.strokeStyle = this.type === 'FAST' ? '#ffd600' : '#8B4513';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(10, -3); ctx.lineTo(24, -12);
                ctx.moveTo(10, 3); ctx.lineTo(24, 12);
                ctx.stroke();

                ctx.fillStyle = this.type === 'FAST' ? '#b71c1c' : '#4a2511';
                ctx.beginPath();
                ctx.ellipse(0, 0, 16, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#1b0a03';
                ctx.beginPath();
                ctx.arc(11, 0, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Food {
            constructor() {
                const bounds = getSafeBounds();
                this.x = getRandom(bounds.minX, bounds.maxX);
                this.y = getRandom(bounds.minY, bounds.maxY);
            }
            draw() {
                ctx.fillStyle = '#ffca28';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 8, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class AIStrike {
            constructor(tx, ty) {
                this.x = tx;
                this.y = ty;
                this.radius = 65;
                this.progress = 0;
                this.isStriking = false;
                this.finished = false;
            }
            update() {
                if (!this.isStriking) {
                    this.progress += 0.035;
                    if (this.progress >= 1) {
                        this.isStriking = true;
                        const cfg = sizeConfig[selectedRoachSize];
                        playASMRSound('splatter', 1, cfg.scale);
                        shakeTime = Math.floor(8 * cfg.scale);
                    }
                } else {
                    this.progress -= 0.12;
                    if (this.progress <= 0) this.finished = true;
                }
            }
            draw() {
                if (!this.isStriking) {
                    ctx.fillStyle = `rgba(255, 61, 0, ${this.progress * 0.35})`;
                    ctx.strokeStyle = '#ff3d00';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else {
                    drawCatPaw(this.x, this.y, 1.3);
                }
            }
        }

        function drawCatPaw(x, y, scale = 1.0) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            ctx.fillStyle = '#141419';
            ctx.beginPath();
            ctx.arc(0, 0, 36, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff4081';
            ctx.beginPath();
            ctx.arc(0, 6, 19, 0, Math.PI * 2);
            ctx.fill();

            const toes = [
                { x: -19, y: -21 },
                { x: -7, y: -29 },
                { x: 7, y: -29 },
                { x: 19, y: -21 }
            ];

            toes.forEach(t => {
                ctx.beginPath();
                ctx.arc(t.x, t.y, 8.5, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        }

        let roaches = [];
        let foods = [];
        let aiStrikes = [];
        let particles = [];
        let stains = [];
        let popTexts = [];
        let playerRoach = { x: 0, y: 0, angle: 0 };

        function getRandom(min, max) { return Math.random() * (max - min) + min; }

        function handleInputMove(px, py) {
            mouseX = px;
            mouseY = py;
            if (gameMode === 'ROACH' && isPlaying && !joystickActive) {
                playerRoach.x = px;
                playerRoach.y = py;
            }
        }

        window.addEventListener('mousemove', (e) => handleInputMove(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) handleInputMove(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        window.addEventListener('touchstart', (e) => {
            initAudio();
            if (e.touches.length > 0) handleInputMove(e.touches[0].clientX, e.touches[0].clientY);
            if ((gameMode === 'CAT' || gameMode === 'FOR_CAT') && isPlaying) {
                checkCatHit(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        window.addEventListener('click', (e) => {
            initAudio();
            if ((gameMode === 'CAT' || gameMode === 'FOR_CAT') && isPlaying) {
                checkCatHit(e.clientX, e.clientY);
            }
        });

        function checkCatHit(hx, hy) {
            let hit = false;
            const cfg = gameMode === 'FOR_CAT' ? sizeConfig['FOR_CAT'] : sizeConfig[selectedRoachSize];

            for (let i = roaches.length - 1; i >= 0; i--) {
                const r = roaches[i];
                if (Math.hypot(r.x - hx, r.y - hy) < cfg.hitRadius) {
                    hit = true;

                    combo++;
                    clearTimeout(comboTimer);
                    comboTimer = setTimeout(() => { combo = 0; updateHUD(); }, 1200);

                    if (gameMode === 'FOR_CAT') {
                        playASMRSound('catToyHit');
                    } else {
                        playASMRSound('splatter', combo, cfg.scale);
                    }

                    shakeTime = Math.floor(6 * cfg.scale);

                    stains.push(new JuiceStain(r.x, r.y, cfg.stainMult));
                    for (let p = 0; p < cfg.particles; p++) {
                        particles.push(new JuiceParticle(r.x, r.y, cfg.scale));
                    }

                    const basePts = r.type === 'FAST' ? 200 : 100;
                    const gainedPts = Math.round(basePts * cfg.scoreMult * (1 + Math.floor(combo / 5)));
                    score += gainedPts;
                    popTexts.push(new PopText(r.x, r.y, `+${gainedPts} ${combo > 1 ? combo + 'x!' : ''}`));

                    roaches.splice(i, 1);
                    roaches.push(new Roach(Math.random() < 0.3 ? 'FAST' : 'NORMAL'));
                    updateHUD();
                    break;
                }
            }
        }

        function updateHUD() {
            document.getElementById('val-score').innerText = score;
            document.getElementById('val-combo').innerText = combo;
        }

        const joyWrapper = document.getElementById('joystick-wrapper');
        const joyStick = document.getElementById('joystick-stick');
        let joystickActive = false;
        let joyVector = { x: 0, y: 0 };

        joyWrapper.addEventListener('touchstart', (e) => { e.stopPropagation(); joystickActive = true; });
        window.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;
            const touch = Array.from(e.touches).find(t => t.target === joyWrapper || joyWrapper.contains(t.target));
            if (!touch) return;
            const rect = joyWrapper.getBoundingClientRect();
            let dx = touch.clientX - (rect.left + rect.width / 2);
            let dy = touch.clientY - (rect.top + rect.height / 2);
            const dist = Math.hypot(dx, dy);
            const maxD = rect.width / 2;
            if (dist > maxD) { dx = (dx / dist) * maxD; dy = (dy / dist) * maxD; }
            joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
            joyVector.x = dx / maxD;
            joyVector.y = dy / maxD;
        });
        window.addEventListener('touchend', () => {
            if (joystickActive) {
                joystickActive = false;
                joyStick.style.transform = `translate(0px, 0px)`;
                joyVector = { x: 0, y: 0 };
            }
        });

        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        function startGame(mode) {
            initAudio();
            gameMode = mode;
            isPlaying = true;
            score = 0;
            combo = 0;
            timeLeft = 30;

            updateHUD();
            document.getElementById('val-time').innerText = timeLeft;

            document.getElementById('menu-overlay').classList.add('hidden');
            document.getElementById('gameover-overlay').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');

            roaches = []; foods = []; aiStrikes = []; particles = []; stains = []; popTexts = [];

            if (gameMode === 'CAT') {
                document.getElementById('card-time').classList.remove('hidden');
                document.getElementById('joystick-wrapper').classList.add('hidden');
                for (let i = 0; i < 6; i++) {
                    roaches.push(new Roach(i % 2 === 0 ? 'FAST' : 'NORMAL'));
                }
            } else if (gameMode === 'FOR_CAT') {
                // 特大真貓模式：畫面保持 3 隻超大蟑螂
                document.getElementById('card-time').classList.add('hidden');
                document.getElementById('joystick-wrapper').classList.add('hidden');
                for (let i = 0; i < 3; i++) {
                    roaches.push(new Roach('NORMAL'));
                }
            } else {
                document.getElementById('card-time').classList.remove('hidden');
                document.getElementById('joystick-wrapper').classList.remove('hidden');
                playerRoach = { x: canvas.width / 2, y: canvas.height / 2, angle: 0 };
                for (let i = 0; i < 4; i++) foods.push(new Food());
            }

            clearInterval(timerInterval);

            if (gameMode !== 'FOR_CAT') {
                timerInterval = setInterval(() => {
                    timeLeft--;
                    document.getElementById('val-time').innerText = timeLeft;

                    if (gameMode === 'ROACH' && isPlaying) {
                        const bounds = getSafeBounds();
                        const tx = Math.random() < 0.65 ? playerRoach.x : getRandom(bounds.minX, bounds.maxX);
                        const ty = Math.random() < 0.65 ? playerRoach.y : getRandom(bounds.minY, bounds.maxY);
                        aiStrikes.push(new AIStrike(tx, ty));
                        playASMRSound('warn');
                    }

                    if (timeLeft <= 0) endGame(true);
                }, 1000);
            }
        }

        function endGame(survived = true) {
            isPlaying = false;
            clearInterval(timerInterval);
            document.getElementById('gameover-overlay').classList.remove('hidden');
            document.getElementById('go-score').innerText = score;

            const title = document.getElementById('go-title');
            const desc = document.getElementById('go-desc');

            if (gameMode === 'CAT') {
                title.innerText = "紓壓爆汁完成！✨";
                desc.innerText = `體型：[${selectedRoachSize}]。你成功擊爆了大量的蟑螂，累積了滿屏噴汁！`;
            } else {
                if (survived) {
                    title.innerText = "逃亡成功！🎉";
                    desc.innerText = "你的身手極度敏捷，順利躲過了貓爪的連續重擊！";
                } else {
                    title.innerText = "啪嘰！你被拍爆了！💀";
                    desc.innerText = "爆漿噴汁！黑貓的反應速度實在太快了。";
                }
            }
        }

        function goHome() {
            isPlaying = false;
            clearInterval(timerInterval);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('gameover-overlay').classList.add('hidden');
            document.getElementById('joystick-wrapper').classList.add('hidden');
            document.getElementById('menu-overlay').classList.remove('hidden');
        }

        function loop() {
            ctx.save();

            if (shakeTime > 0) {
                const sx = (Math.random() - 0.5) * shakeTime * 2;
                const sy = (Math.random() - 0.5) * shakeTime * 2;
                ctx.translate(sx, sy);
                shakeTime--;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            stains.forEach(s => s.draw());

            if (isPlaying) {
                if (gameMode === 'CAT') {
                    roaches.forEach(r => { r.update(); r.draw(); });
                    drawCatPaw(mouseX, mouseY, 1.0);
                } else if (gameMode === 'FOR_CAT') {
                    roaches.forEach(r => { r.update(); r.draw(); });
                } else if (gameMode === 'ROACH') {
                    const cfg = sizeConfig[selectedRoachSize];
                    let speed = 5.5 * cfg.speedMult;

                    if (joystickActive) {
                        playerRoach.x += joyVector.x * speed;
                        playerRoach.y += joyVector.y * speed;
                        playerRoach.angle = Math.atan2(joyVector.y, joyVector.x);
                    }
                    if (keys['ArrowLeft'] || keys['a']) playerRoach.x -= speed;
                    if (keys['ArrowRight'] || keys['d']) playerRoach.x += speed;
                    if (keys['ArrowUp'] || keys['w']) playerRoach.y -= speed;
                    if (keys['ArrowDown'] || keys['s']) playerRoach.y += speed;

                    const bounds = getSafeBounds();
                    playerRoach.x = Math.max(bounds.minX, Math.min(bounds.maxX, playerRoach.x));
                    playerRoach.y = Math.max(bounds.minY, Math.min(bounds.maxY, playerRoach.y));

                    foods.forEach((f, idx) => {
                        f.draw();
                        if (Math.hypot(f.x - playerRoach.x, f.y - playerRoach.y) < (22 * cfg.scale)) {
                            score += 50;
                            updateHUD();
                            playASMRSound('eat');
                            foods[idx] = new Food();
                        }
                    });

                    for (let i = aiStrikes.length - 1; i >= 0; i--) {
                        const strike = aiStrikes[i];
                        strike.update();
                        strike.draw();

                        if (strike.isStriking) {
                            if (Math.hypot(strike.x - playerRoach.x, strike.y - playerRoach.y) < strike.radius) {
                                stains.push(new JuiceStain(playerRoach.x, playerRoach.y, cfg.stainMult));
                                for (let p = 0; p < cfg.particles; p++) particles.push(new JuiceParticle(playerRoach.x, playerRoach.y, cfg.scale));
                                endGame(false);
                            }
                        }
                        if (strike.finished) aiStrikes.splice(i, 1);
                    }

                    ctx.save();
                    ctx.translate(playerRoach.x, playerRoach.y);
                    if (joystickActive) ctx.rotate(playerRoach.angle);
                    ctx.scale(cfg.scale, cfg.scale);
                    ctx.fillStyle = '#ff3d00';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 16, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#dd2c00';
                    ctx.beginPath();
                    ctx.arc(10, 0, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.update();
                    p.draw();
                    if (p.alpha <= 0) particles.splice(i, 1);
                }

                for (let i = popTexts.length - 1; i >= 0; i--) {
                    const pt = popTexts[i];
                    pt.update();
                    pt.draw();
                    if (pt.alpha <= 0) popTexts.splice(i, 1);
                }
            }

            ctx.restore();
            requestAnimationFrame(loop);
        }

        document.querySelectorAll('.btn-size').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.btn-size').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                selectedRoachSize = e.target.getAttribute('data-size');
            });
        });

        document.getElementById('mode-cat').addEventListener('click', () => startGame('CAT'));
        document.getElementById('mode-for-cat').addEventListener('click', () => startGame('FOR_CAT'));
        document.getElementById('mode-roach').addEventListener('click', () => startGame('ROACH'));
        document.getElementById('btn-hud-home').addEventListener('click', goHome);
        document.getElementById('btn-go-home').addEventListener('click', goHome);
        document.getElementById('btn-restart').addEventListener('click', () => startGame(gameMode));

        loop();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>黑貓vs蟑螂</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background-color: #0d0d12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a24 0%, #08080c 100%);
            overflow: hidden;
            cursor: none;
        }

        /* 網格背景 */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 60px 60px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            pointer-events: none;
        }

        /* 頂部 HUD */
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .hud-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .hud-card {
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 8px 18px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .hud-label {
            font-size: 0.75rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #aeea00;
        }

        .btn-home {
            pointer-events: auto;
            background: #ff3d00;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 61, 0, 0.4);
            transition: transform 0.1s;
        }

        .btn-home:active {
            transform: scale(0.95);
        }

        /* 選單與結算 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 8, 12, 0.88);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #aeea00, #ff9100);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(174, 234, 0, 0.3);
        }

        p.subtitle {
            color: #bbb;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .mode-cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 700px;
        }

        .mode-card {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            width: 280px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mode-card:hover, .mode-card:active {
            transform: translateY(-5px);
            border-color: #aeea00;
            background: rgba(174, 234, 0, 0.1);
            box-shadow: 0 10px 30px rgba(174, 234, 0, 0.25);
        }

        .mode-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        .mode-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }

        .mode-desc {
            font-size: 0.9rem;
            color: #aaa;
            line-height: 1.4;
        }

        .btn-action {
            background: linear-gradient(45deg, #aeea00, #76ff03);
            color: #121212;
            border: none;
            padding: 14px 36px;
            font-size: 1.25rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 20px rgba(118, 255, 3, 0.4);
            transition: transform 0.1s;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        /* 虛擬搖桿 */
        #joystick-wrapper {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            z-index: 50;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #joystick-stick {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #aeea00, #64dd17);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            position: absolute;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="grid-bg"></div>

        <!-- 頂部資訊欄 -->
        <div id="hud" class="hidden">
            <button class="btn-home" id="btn-hud-home">🏠 首頁</button>
            <div class="hud-group">
                <div class="hud-card">
                    <span class="hud-label">連擊 COMBO</span>
                    <span class="hud-value" id="val-combo" style="color:#ffea00;">0</span>
                </div>
                <div class="hud-card">
                    <span class="hud-label">得分</span>
                    <span class="hud-value" id="val-score">0</span>
                </div>
                <div class="hud-card">
                    <span class="hud-label">剩餘時間</span>
                    <span class="hud-value" id="val-time" style="color:#ff3d00;">30</span>
                </div>
            </div>
        </div>

        <!-- 虛擬搖桿 -->
        <div id="joystick-wrapper" class="hidden">
            <div id="joystick-stick"></div>
        </div>

        <!-- 主選單 -->
        <div id="menu-overlay" class="overlay">
            <h1>黑貓拍拍：爆汁 ASMR</h1>
            <p class="subtitle">聽覺與視覺的雙重紓壓打擊樂趣！</p>

            <div class="mode-cards">
                <div class="mode-card" id="mode-cat">
                    <div class="mode-icon">🐾</div>
                    <div class="mode-title">貓爪爆汁拍拍</div>
                    <div class="mode-desc">瘋狂啪啪啪拍爆蟑螂！享受嘎吱碎裂聲與滿屏綠汁噴濺的 ASMR 紓壓體驗。</div>
                </div>

                <div class="mode-card" id="mode-roach">
                    <div class="mode-icon">🪳</div>
                    <div class="mode-title">蟑螂極限逃亡</div>
                    <div class="mode-desc">操控蟑螂吃餅乾，閃避天降貓爪重擊！被拍到會瞬間爆漿！</div>
                </div>
            </div>
        </div>

        <!-- 結算畫面 -->
        <div id="gameover-overlay" class="overlay hidden">
            <h1 id="go-title">遊戲結束</h1>
            <p id="go-desc" style="font-size: 1.2rem; color: #aeea00; margin-bottom: 15px;"></p>
            <div class="hud-card" style="margin-bottom: 20px; padding: 15px 30px;">
                <span class="hud-label">最終紓壓分數</span>
                <span class="hud-value" id="go-score" style="font-size: 2.5rem;">0</span>
            </div>
            <div style="display: flex; gap: 15px;">
                <button class="btn-action" id="btn-restart">再爽一次</button>
                <button class="btn-action" id="btn-go-home" style="background: #444; color: #fff; box-shadow:none;">返回首頁</button>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Web Audio API - 高級 ASMR 音效生成器
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // ASMR 擬真爆汁與啪啪音效
        function playASMRSound(type, combo = 1) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'splatter') {
                // 1. 低頻肉墊拍擊聲 (Slap Thud)
                const oscThud = audioCtx.createOscillator();
                const gainThud = audioCtx.createGain();
                oscThud.type = 'triangle';
                oscThud.frequency.setValueAtTime(160, now);
                oscThud.frequency.exponentialRampToValueAtTime(30, now + 0.12);
                gainThud.gain.setValueAtTime(0.6, now);
                gainThud.gain.linearRampToValueAtTime(0.01, now + 0.12);
                oscThud.connect(gainThud);
                gainThud.connect(audioCtx.destination);
                oscThud.start(now);
                oscThud.stop(now + 0.12);

                // 2. 爆汁碎裂聲 (Squish Crackle Noise)
                const bufferSize = audioCtx.sampleRate * 0.15;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1200 + Math.random() * 800, now);
                filter.Q.setValueAtTime(3, now);

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.5, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noise.start(now);

                // 3. Combo 療癒高音階 (Pico Pop)
                const oscPop = audioCtx.createOscillator();
                const gainPop = audioCtx.createGain();
                oscPop.type = 'sine';
                const baseFreq = 400 + Math.min(combo * 40, 600);
                oscPop.frequency.setValueAtTime(baseFreq, now);
                oscPop.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, now + 0.08);
                gainPop.gain.setValueAtTime(0.2, now);
                gainPop.gain.linearRampToValueAtTime(0.01, now + 0.08);
                oscPop.connect(gainPop);
                gainPop.connect(audioCtx.destination);
                oscPop.start(now);
                oscPop.stop(now + 0.08);

            } else if (type === 'eat') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, now);
                osc.frequency.exponentialRampToValueAtTime(1040, now + 0.09);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.09);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.09);

            } else if (type === 'warn') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(360, now + 0.2);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 遊戲狀態
        let gameMode = null;
        let isPlaying = false;
        let score = 0;
        let combo = 0;
        let comboTimer = null;
        let timeLeft = 30;
        let timerInterval = null;
        let shakeTime = 0;

        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;

        function getSafeBounds() {
            return {
                minX: 60,
                maxX: canvas.width - 60,
                minY: canvas.height * 0.18,
                maxY: canvas.height * 0.82
            };
        }

        // 地面留下的綠液印記 (Splatter Mark)
        class JuiceStain {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = getRandom(20, 45);
                this.alpha = 0.8;
                this.color = Math.random() < 0.7 ? '#aeea00' : '#76ff03';
                this.splats = [];
                for (let i = 0; i < 6; i++) {
                    this.splats.push({
                        dx: (Math.random() - 0.5) * this.size * 1.5,
                        dy: (Math.random() - 0.5) * this.size * 1.5,
                        r: getRandom(3, 10)
                    });
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;

                // 主汁斑
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
                ctx.fill();

                // 四濺小小斑
                this.splats.forEach(s => {
                    ctx.beginPath();
                    ctx.arc(this.x + s.dx, this.y + s.dy, s.r, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.restore();
            }
        }

        // 動態爆汁噴飛粒子 (Particle Splatter)
        class JuiceParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = getRandom(4, 16);
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.radius = getRandom(3, 8);
                this.color = Math.random() < 0.6 ? '#aeea00' : (Math.random() < 0.5 ? '#76ff03' : '#ffd600');
                this.alpha = 1.0;
                this.decay = getRandom(0.02, 0.04);
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.92;
                this.vy *= 0.92;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // 文字彈出 (Popup Text)
        class PopText {
            constructor(x, y, text) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.alpha = 1.0;
                this.vy = -2;
            }
            update() {
                this.y += this.vy;
                this.alpha -= 0.03;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = '900 24px sans-serif';
                ctx.fillStyle = '#aeea00';
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 5;
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // 蟑螂類別
        class Roach {
            constructor(type = 'NORMAL') {
                const bounds = getSafeBounds();
                this.x = getRandom(bounds.minX, bounds.maxX);
                this.y = getRandom(bounds.minY, bounds.maxY);
                this.type = type; // 'NORMAL' or 'FAST'
                this.speedMult = type === 'FAST' ? 1.8 : 1.0;
                this.size = 26;
                this.vx = (Math.random() - 0.5) * 6 * this.speedMult;
                this.vy = (Math.random() - 0.5) * 6 * this.speedMult;
                this.angle = Math.atan2(this.vy, this.vx);
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                const bounds = getSafeBounds();

                if (this.x < bounds.minX || this.x > bounds.maxX) this.vx *= -1;
                if (this.y < bounds.minY || this.y > bounds.maxY) this.vy *= -1;

                if (Math.random() < 0.04) {
                    this.vx = (Math.random() - 0.5) * 7 * this.speedMult;
                    this.vy = (Math.random() - 0.5) * 7 * this.speedMult;
                }

                this.angle = Math.atan2(this.vy, this.vx);
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // 觸角
                ctx.strokeStyle = this.type === 'FAST' ? '#ffd600' : '#8B4513';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(10, -3); ctx.lineTo(24, -12);
                ctx.moveTo(10, 3); ctx.lineTo(24, 12);
                ctx.stroke();

                // 身體
                ctx.fillStyle = this.type === 'FAST' ? '#b71c1c' : '#4a2511';
                ctx.beginPath();
                ctx.ellipse(0, 0, 16, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                // 頭部
                ctx.fillStyle = '#1b0a03';
                ctx.beginPath();
                ctx.arc(11, 0, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // 食物屑
        class Food {
            constructor() {
                const bounds = getSafeBounds();
                this.x = getRandom(bounds.minX, bounds.maxX);
                this.y = getRandom(bounds.minY, bounds.maxY);
            }
            draw() {
                ctx.fillStyle = '#ffca28';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 8, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // AI 貓爪重擊 (蟑螂逃亡模式)
        class AIStrike {
            constructor(tx, ty) {
                this.x = tx;
                this.y = ty;
                this.radius = 65;
                this.progress = 0;
                this.isStriking = false;
                this.finished = false;
            }
            update() {
                if (!this.isStriking) {
                    this.progress += 0.035;
                    if (this.progress >= 1) {
                        this.isStriking = true;
                        playASMRSound('splatter');
                        shakeTime = 8;
                    }
                } else {
                    this.progress -= 0.12;
                    if (this.progress <= 0) this.finished = true;
                }
            }
            draw() {
                if (!this.isStriking) {
                    ctx.fillStyle = `rgba(255, 61, 0, ${this.progress * 0.35})`;
                    ctx.strokeStyle = '#ff3d00';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else {
                    drawCatPaw(this.x, this.y, 1.3);
                }
            }
        }

        // 繪製黑貓爪
        function drawCatPaw(x, y, scale = 1.0) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // 外陰影
            ctx.fillStyle = '#141419';
            ctx.beginPath();
            ctx.arc(0, 0, 36, 0, Math.PI * 2);
            ctx.fill();

            // 主粉紅肉墊
            ctx.fillStyle = '#ff4081';
            ctx.beginPath();
            ctx.arc(0, 6, 19, 0, Math.PI * 2);
            ctx.fill();

            // 腳趾
            const toes = [
                { x: -19, y: -21 },
                { x: -7, y: -29 },
                { x: 7, y: -29 },
                { x: 19, y: -21 }
            ];

            toes.forEach(t => {
                ctx.beginPath();
                ctx.arc(t.x, t.y, 8.5, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        }

        // 容器與陣列
        let roaches = [];
        let foods = [];
        let aiStrikes = [];
        let particles = [];
        let stains = [];
        let popTexts = [];
        let playerRoach = { x: 0, y: 0, angle: 0 };

        function getRandom(min, max) { return Math.random() * (max - min) + min; }

        // --- 觸控與點擊控制 ---
        function handleInputMove(px, py) {
            mouseX = px;
            mouseY = py;
            if (gameMode === 'ROACH' && isPlaying && !joystickActive) {
                playerRoach.x = px;
                playerRoach.y = py;
            }
        }

        window.addEventListener('mousemove', (e) => handleInputMove(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) handleInputMove(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        window.addEventListener('touchstart', (e) => {
            initAudio();
            if (e.touches.length > 0) handleInputMove(e.touches[0].clientX, e.touches[0].clientY);
            if (gameMode === 'CAT' && isPlaying) checkCatHit(mouseX, mouseY);
        }, { passive: false });

        window.addEventListener('click', (e) => {
            initAudio();
            if (gameMode === 'CAT' && isPlaying) checkCatHit(e.clientX, e.clientY);
        });

        // 拍打爆汁處理
        function checkCatHit(hx, hy) {
            let hit = false;
            for (let i = roaches.length - 1; i >= 0; i--) {
                const r = roaches[i];
                if (Math.hypot(r.x - hx, r.y - hy) < 60) {
                    hit = true;

                    // 1. Combo 計算
                    combo++;
                    clearTimeout(comboTimer);
                    comboTimer = setTimeout(() => { combo = 0; updateHUD(); }, 1

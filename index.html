<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>黑貓 vs 蟑螂大對決</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #2a2a35 0%, #121218 100%);
            overflow: hidden;
            cursor: none;
        }

        /* 網格背景 (Gridshot 風格) */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            pointer-events: none;
        }

        /* 頂部 HUD 欄位 */
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .hud-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .hud-card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud-label {
            font-size: 0.75rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffca28;
        }

        .btn-home {
            pointer-events: auto;
            background: #ff5252;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 82, 82, 0.4);
            transition: transform 0.1s, background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-home:active {
            transform: scale(0.95);
            background: #e04848;
        }

        /* 主選單 & 結算畫面 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff9800, #ff5722);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #ccc;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .mode-cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 700px;
        }

        .mode-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            width: 280px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mode-card:hover, .mode-card:active {
            transform: translateY(-5px);
            border-color: #ff9800;
            background: rgba(255, 152, 0, 0.1);
            box-shadow: 0 10px 25px rgba(255, 152, 0, 0.2);
        }

        .mode-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .mode-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }

        .mode-desc {
            font-size: 0.85rem;
            color: #aaa;
            line-height: 1.4;
        }

        /* 按鈕樣式 */
        .btn-action {
            background: linear-gradient(45deg, #ff9800, #ff5722);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(255, 87, 34, 0.4);
            transition: transform 0.1s;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        /* 虛擬搖桿 (Joystick) */
        #joystick-wrapper {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            z-index: 50;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #joystick-stick {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #ff9800, #e65100);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            position: absolute;
        }

        /* 遊戲主 Canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="grid-bg"></div>

        <!-- 頂部資訊欄 -->
        <div id="hud" class="hidden">
            <button class="btn-home" id="btn-hud-home">🏠 首頁</button>
            <div class="hud-group">
                <div class="hud-card">
                    <span class="hud-label" id="label-score">分數</span>
                    <span class="hud-value" id="val-score">0</span>
                </div>
                <div class="hud-card">
                    <span class="hud-label" id="label-time">時間</span>
                    <span class="hud-value" id="val-time">30</span>
                </div>
            </div>
        </div>

        <!-- 虛擬搖桿 (僅在蟑螂逃亡模式顯示) -->
        <div id="joystick-wrapper" class="hidden">
            <div id="joystick-stick"></div>
        </div>

        <!-- 主選單 (選擇身份) -->
        <div id="menu-overlay" class="overlay">
            <h1>黑貓 vs 蟑螂大對決</h1>
            <p class="subtitle">請選擇你想要扮演的角色</p>

            <div class="mode-cards">
                <div class="mode-card" id="mode-cat">
                    <div class="mode-icon">🐾</div>
                    <div class="mode-title">當貓爪獵人</div>
                    <div class="mode-desc">快速點擊拍打場上瘋狂逃竄的蟑螂！練就極致反應力與準心。</div>
                </div>

                <div class="mode-card" id="mode-roach">
                    <div class="mode-icon">🪳</div>
                    <div class="mode-title">當逃亡蟑螂</div>
                    <div class="mode-desc">操控蟑螂吃餅乾屑拿高分，同時閃避天降貓爪的致命重擊！</div>
                </div>
            </div>
        </div>

        <!-- 遊戲結束結算畫面 -->
        <div id="gameover-overlay" class="overlay hidden">
            <h1 id="go-title">遊戲結束</h1>
            <p id="go-desc" style="font-size: 1.2rem; color: #ffca28; margin-bottom: 15px;"></p>
            <div class="hud-card" style="margin-bottom: 20px; padding: 15px 30px;">
                <span class="hud-label">最終得分</span>
                <span class="hud-value" id="go-score" style="font-size: 2.5rem;">0</span>
            </div>
            <div style="display: flex; gap: 15px;">
                <button class="btn-action" id="btn-restart">再玩一次</button>
                <button class="btn-action" id="btn-go-home" style="background: #555;">返回首頁</button>
            </div>
        </div>

        <!-- 畫布 -->
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 音效合成 (Web Audio API)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'eat') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'warn') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(400, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // 調整 Canvas 尺寸
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 遊戲狀態
        let gameMode = null; // 'CAT' or 'ROACH'
        let isPlaying = false;
        let score = 0;
        let timeLeft = 30;
        let timerInterval = null;

        // 位置與控制器狀態
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;

        // 蟑螂生成安全區域 (避免生成在太上面或太下面)
        function getSafeBounds() {
            return {
                minX: 50,
                maxX: canvas.width - 50,
                minY: canvas.height * 0.18, // 避開頂部 18% 區域
                maxY: canvas.height * 0.82  // 避開底部 18% 區域
            };
        }

        // 蟑螂物件
        class Roach {
            constructor(x, y) {
                this.x = x || getRandom(getSafeBounds().minX, getSafeBounds().maxX);
                this.y = y || getRandom(getSafeBounds().minY, getSafeBounds().maxY);
                this.size = 25;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.angle = Math.atan2(this.vy, this.vx);
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                const bounds = getSafeBounds();

                // 邊界反彈
                if (this.x < bounds.minX || this.x > bounds.maxX) this.vx *= -1;
                if (this.y < bounds.minY || this.y > bounds.maxY) this.vy *= -1;

                // 隨機改變方向
                if (Math.random() < 0.03) {
                    this.vx = (Math.random() - 0.5) * 7;
                    this.vy = (Math.random() - 0.5) * 7;
                }

                this.angle = Math.atan2(this.vy, this.vx);
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // 觸角
                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(10, -3);
                ctx.lineTo(22, -10);
                ctx.moveTo(10, 3);
                ctx.lineTo(22, 10);
                ctx.stroke();

                // 身體
                ctx.fillStyle = '#4a2511';
                ctx.beginPath();
                ctx.ellipse(0, 0, 15, 9, 0, 0, Math.PI * 2);
                ctx.fill();

                // 蟑螂頭部
                ctx.fillStyle = '#2b1408';
                ctx.beginPath();
                ctx.arc(10, 0, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // 食物屑物件 (蟑螂模式用)
        class Food {
            constructor() {
                const bounds = getSafeBounds();
                this.x = getRandom(bounds.minX, bounds.maxX);
                this.y = getRandom(bounds.minY, bounds.maxY);
                this.size = 8;
            }

            draw() {
                ctx.fillStyle = '#ffca28';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 敵方貓爪打擊 (蟑螂模式用)
        class AIStrike {
            constructor(targetX, targetY) {
                this.x = targetX;
                this.y = targetY;
                this.radius = 60;
                this.progress = 0; // 0 到 1 漸變預告
                this.isStriking = false;
                this.finished = false;
            }

            update() {
                if (!this.isStriking) {
                    this.progress += 0.03;
                    if (this.progress >= 1) {
                        this.isStriking = true;
                        playSound('hit');
                    }
                } else {
                    this.progress -= 0.1;
                    if (this.progress <= 0) {
                        this.finished = true;
                    }
                }
            }

            draw() {
                if (!this.isStriking) {
                    // 警示陰影圈
                    ctx.fillStyle = `rgba(255, 82, 82, ${this.progress * 0.3})`;
                    ctx.strokeStyle = '#ff5252';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else {
                    // 貓爪落下重擊
                    drawCatPaw(this.x, this.y, 1.2);
                }
            }
        }

        // 繪製黑貓爪
        function drawCatPaw(x, y, scale = 1.0) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // 肉墊影
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.arc(0, 0, 35, 0, Math.PI * 2);
            ctx.fill();

            // 主肉墊 (粉紅色)
            ctx.fillStyle = '#ff80ab';
            ctx.beginPath();
            ctx.arc(0, 5, 18, 0, Math.PI * 2);
            ctx.fill();

            // 四個趾墊
            const toes = [
                { x: -18, y: -20 },
                { x: -7, y: -28 },
                { x: 7, y: -28 },
                { x: 18, y: -20 }
            ];

            toes.forEach(t => {
                ctx.beginPath();
                ctx.arc(t.x, t.y, 8, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        }

        // 遊戲變數
        let roaches = [];
        let foods = [];
        let aiStrikes = [];
        let playerRoach = { x: 0, y: 0, vx: 0, vy: 0, angle: 0 };

        function getRandom(min, max) {
            return Math.random() * (max - min) + min;
        }

        // --- 觸控與控制邏輯 (修復移動與座標) ---

        function handleInputMove(px, py) {
            mouseX = px;
            mouseY = py;

            if (gameMode === 'ROACH' && isPlaying) {
                if (!joystickActive) {
                    playerRoach.x = px;
                    playerRoach.y = py;
                }
            }
        }

        window.addEventListener('mousemove', (e) => handleInputMove(e.clientX, e.clientY));

        // 修復手機觸控滑動跟隨
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                handleInputMove(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        window.addEventListener('touchstart', (e) => {
            initAudio();
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                handleInputMove(touch.clientX, touch.clientY);
            }
            if (gameMode === 'CAT' && isPlaying) {
                checkCatHit(mouseX, mouseY);
            }
        }, { passive: false });

        window.addEventListener('click', (e) => {
            initAudio();
            if (gameMode === 'CAT' && isPlaying) {
                checkCatHit(e.clientX, e.clientY);
            }
        });

        // 貓爪拍打命中判定
        function checkCatHit(hx, hy) {
            playSound('hit');
            for (let i = roaches.length - 1; i >= 0; i--) {
                const r = roaches[i];
                const dist = Math.hypot(r.x - hx, r.y - hy);
                if (dist < 55) { // 加大命中範圍
                    roaches.splice(i, 1);
                    score += 100;
                    document.getElementById('val-score').innerText = score;
                    // 重新生成一隻
                    roaches.push(new Roach());
                    break;
                }
            }
        }

        // --- 虛擬搖桿 (Joystick) 控制 ---
        const joyWrapper = document.getElementById('joystick-wrapper');
        const joyStick = document.getElementById('joystick-stick');
        let joystickActive = false;
        let joyVector = { x: 0, y: 0 };

        joyWrapper.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            joystickActive = true;
        });

        window.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;
            const touch = Array.from(e.touches).find(t => t.target === joyWrapper || joyWrapper.contains(t.target));
            if (!touch) return;

            const rect = joyWrapper.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.hypot(dx, dy);
            const maxDist = rect.width / 2;

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
            joyVector.x = dx / maxDist;
            joyVector.y = dy / maxDist;
        });

        window.addEventListener('touchend', () => {
            if (joystickActive) {
                joystickActive = false;
                joyStick.style.transform = `translate(0px, 0px)`;
                joyVector = { x: 0, y: 0 };
            }
        });

        // 鍵盤控制 (蟑螂模式)
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        // --- 遊戲流程控制 ---

        function startGame(mode) {
            initAudio();
            gameMode = mode;
            isPlaying = true;
            score = 0;
            timeLeft = 30;

            document.getElementById('val-score').innerText = score;
            document.getElementById('val-time').innerText = timeLeft;

            document.getElementById('menu-overlay').classList.add('hidden');
            document.getElementById('gameover-overlay').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');

            roaches = [];
            foods = [];
            aiStrikes = [];

            if (gameMode === 'CAT') {
                document.getElementById('joystick-wrapper').classList.add('hidden');
                // 生成 5 隻蟑螂
                for (let i = 0; i < 5; i++) {
                    roaches.push(new Roach());
                }
            } else {
                // 蟑螂逃亡模式
                document.getElementById('joystick-wrapper').classList.remove('hidden');
                playerRoach = {
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: 0,
                    vy: 0,
                    angle: 0
                };
                // 生成 4 個餅乾屑
                for (let i = 0; i < 4; i++) {
                    foods.push(new Food());
                }
            }

            // 倒數計時器
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('val-time').innerText = timeLeft;

                if (gameMode === 'ROACH' && isPlaying) {
                    const bounds = getSafeBounds();
                    const strikeX = Math.random() < 0.6 ? playerRoach.x : getRandom(bounds.minX, bounds.maxX);
                    const strikeY = Math.random() < 0.6 ? playerRoach.y : getRandom(bounds.minY, bounds.maxY);
                    aiStrikes.push(new AIStrike(strikeX, strikeY));
                    playSound('warn');
                }

                if (timeLeft <= 0) {
                    endGame(true);
                }
            }, 1000);
        }

        function endGame(survived = true) {
            isPlaying = false;
            clearInterval(timerInterval);

            document.getElementById('gameover-overlay').classList.remove('hidden');
            document.getElementById('go-score').innerText = score;

            const title = document.getElementById('go-title');
            const desc = document.getElementById('go-desc');

            if (gameMode === 'CAT') {
                title.innerText = "時間到！";
                desc.innerText = `你成功拍打捕獲了大量蟑螂！`;
            } else {
                if (survived) {
                    title.innerText = "逃亡成功！🎉";
                    desc.innerText = "你成功躲過了黑貓的所有連續重擊！";
                } else {
                    title.innerText = "你被貓爪扁扁了！💀";
                    desc.innerText = "逃亡失敗，黑貓的反應速度太快了！";
                }
            }
        }

        function goHome() {
            isPlaying = false;
            clearInterval(timerInterval);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('gameover-overlay').classList.add('hidden');
            document.getElementById('joystick-wrapper').classList.add('hidden');
            document.getElementById('menu-overlay').classList.remove('hidden');
        }

        // --- 核心遊戲循環 ---
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isPlaying) {
                if (gameMode === 'CAT') {
                    // 貓爪模式：更新並繪製蟑螂
                    roaches.forEach(r => {
                        r.update();
                        r.draw();
                    });
                    // 繪製玩家貓爪
                    drawCatPaw(mouseX, mouseY, 1.0);

                } else if (gameMode === 'ROACH') {
                    // 蟑螂逃亡模式：更新玩家蟑螂位置
                    let speed = 5;

                    if (joystickActive) {
                        playerRoach.x += joyVector.x * speed;
                        playerRoach.y += joyVector.y * speed;
                        playerRoach.angle = Math.atan2(joyVector.y, joyVector.x);
                    }

                    if (keys['ArrowLeft'] || keys['a']) playerRoach.x -= speed;
                    if (keys['ArrowRight'] || keys['d']) playerRoach.x += speed;
                    if (keys['ArrowUp'] || keys['w']) playerRoach.y -= speed;
                    if (keys['ArrowDown'] || keys['s']) playerRoach.y += speed;

                    // 限制安全區域
                    const bounds = getSafeBounds();
                    playerRoach.x = Math.max(bounds.minX, Math.min(bounds.maxX, playerRoach.x));
                    playerRoach.y = Math.max(bounds.minY, Math.min(bounds.maxY, playerRoach.y));

                    // 繪製餅乾屑並判定吃食物
                    foods.forEach((f, idx) => {
                        f.draw();
                        if (Math.hypot(f.x - playerRoach.x, f.y - playerRoach.y) < 20) {
                            score += 50;
                            document.getElementById('val-score').innerText = score;
                            playSound('eat');
                            foods[idx] = new Food();
                        }
                    });

                    // 更新並繪製 AI 貓爪打擊
                    for (let i = aiStrikes.length - 1; i >= 0; i--) {
                        const strike = aiStrikes[i];
                        strike.update();
                        strike.draw();

                        if (strike.isStriking) {
                            if (Math.hypot(strike.x - playerRoach.x, strike.y - playerRoach.y) < strike.radius) {
                                endGame(false);
                            }
                        }

                        if (strike.finished) {
                            aiStrikes.splice(i, 1);
                        }
                    }

                    // 繪製玩家蟑螂
                    ctx.save();
                    ctx.translate(playerRoach.x, playerRoach.y);
                    if (joystickActive) ctx.rotate(playerRoach.angle);
                    ctx.fillStyle = '#ff5722';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 16, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#bf360c';
                    ctx.beginPath();
                    ctx.arc(10, 0, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            requestAnimationFrame(loop);
        }

        // --- UI 事件綁定 ---
        document.getElementById('mode-cat').addEventListener('click', () => startGame('CAT'));
        document.getElementById('mode-roach').addEventListener('click', () => startGame('ROACH'));
        document.getElementById('btn-hud-home').addEventListener('click', goHome);
        document.getElementById('btn-go-home').addEventListener('click', goHome);
        document.getElementById('btn-restart').addEventListener('click', () => startGame(gameMode));

        // 啟動繪製循環
        loop();
    </script>
</body>
</html>
